data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  vocab_path: "data/processed/vocab.json"
  vocab_size: 30000
  max_seq_len: 128
  mlm_probability: 0.15
  pad_token_id: 0
  unk_token_id: 1
  cls_token_id: 2
  sep_token_id: 3
  mask_token_id: 4
  ignore_index: -100

model:
  vocab_size: 30000
  hidden_size: 256
  num_layers: 4
  num_heads: 4
  intermediate_size: 1024
  max_seq_len: 128
  type_vocab_size: 2
  dropout: 0.1
  tie_weights: true          # [Kategori (a) - Arsitektur] Weight tying Embedding <-> MLMHead
  pre_norm: true             # [Kategori (a) - Arsitektur] Pre-LN Transformer + Final LayerNorm

training:
  seed: 42
  batch_size: 32             # [Kategori (c) - Training] Diturunkan 64 -> 32 (~488 step/epoch, 2x update/epoch)
  epochs: 120                # [Kategori (c) - Training] Dinaikkan 15 -> 120 (~58.500 total step maksimal)
  lr: 8.0e-4                 # [Kategori (c) - Training] Peak LR optimal untuk Pre-LN + BS 32
  weight_decay: 0.01         # [Kategori (c) - Training] Regularisasi AdamW
  scheduler: "cosine"        # [Kategori (c) - Training] Cosine annealing dengan min_lr_ratio=0.05
  warmup_steps: 1500         # [Kategori (c) - Training] Warmup absolut (~3 epoch pertama)
  warmup_ratio: 0.06         # [Kategori (c) - Training] Fallback jika warmup_steps diset 0 / null
  min_lr_ratio: 0.05         # [Kategori (c) - Training] Menjaga LR akhir tidak langsung 0
  max_grad_norm: 1.0         # [Kategori (c) - Training] Gradient clipping setelah unscale FP16
  fp16: true                 # [Kategori (c) - Training] Mixed precision untuk GPU T4
  patience: 15               # [Kategori (c) - Training] Early stopping jika Val Loss stagnan 15 epoch
  min_delta: 0.0005          # [Kategori (c) - Training] Ambang minimal perbaikan Val Loss
  num_workers: 2
  checkpoint_dir: "checkpoints"